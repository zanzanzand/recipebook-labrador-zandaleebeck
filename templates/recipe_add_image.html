{% extends 'base.html' %}
{% load static %}
{% block title %}Add Image to Recipe{% endblock %}
{% block content %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Image</button>
    </form>
    <h3>
        <a href="{% url 'ledger:recipe_detail' recipe.pk %}">Return</a>
    </h3>
{% endblock %}
